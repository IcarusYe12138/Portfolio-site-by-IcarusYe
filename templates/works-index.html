<!--
  templates/works-index.html — 全部作品索引页骨架
  依赖：trilingual.html 的字典 + 引擎（CASE_T / setLang / site:lang 事件）
        音频卡接线：从 audio-player.html 复制 <style> 与 <script> 段
  机制：
    · 计数自动化——筛选按钮计数从 data-cat 实时统计，绝不手写 N（见 10-content-ops.md）
    · 筛选动画 = 淡入 + 上移 24px + scale(.96→1)，90ms 错落，结束清 transitionDelay
    · 外链卡 data-href-en / data-href-zh 双地址；HIGHLIGHT 徽标三语
    · 头部「INDEX ×N」由 JS 从卡片数生成（模板内已做，手写文案只留占位）
-->

          <img src="assets/works/demo2.webp" alt="…" data-i18n-alt="alt2" loading="lazy">
        </div>
        <div class="cell-cap">

<!-- ============ 最小样式（token 套你的设计系统） ============ -->
<style>
.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.cell{display:flex;flex-direction:column;border:1px solid #E3E6EA;background:#fff;text-decoration:none;color:inherit;transition:transform .2s}
.cell:hover{transform:translateY(-3px)}
.cell-media{position:relative;aspect-ratio:16/9;overflow:hidden;background:#F5F6F7}
.cell-media img{width:100%;height:100%;object-fit:cover}
@media (hover:hover) and (pointer:fine){
  .cell-media img{filter:grayscale(1)}
  .cell:hover .cell-media img{filter:grayscale(0);transform:scale(1.03)}
}
.cell-idx{position:absolute;top:10px;left:12px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.16em;color:#fff;background:#1A1A2E;padding:3px 7px}
.cell-hl{position:absolute;top:10px;right:12px;font:600 9px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:var(--accent,#2F2FE4);padding:3px 7px}
.cell-cap{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding:14px 16px;border-top:1px solid #E3E6EA}
.cell-title{font-size:13.5px;font-weight:500}
.cell-cat{margin-top:auto;padding-top:8px;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.5}
.cell-src{font:600 9px/1 ui-monospace,monospace;letter-spacing:.2em;color:var(--accent,#2F2FE4);margin-top:4px}
.cell-audio .cell-media{display:flex;align-items:center;padding:0 18px}
.fbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.fbtn{border:1px solid #E3E6EA;background:#fff;padding:8px 14px;font:500 11px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.fbtn.on{border-color:var(--accent,#2F2FE4);color:var(--accent,#2F2FE4)}
.fbtn sup{margin-left:2px;opacity:.6}
/* 筛选错落动画：进场三态，结束必须清 transitionDelay（防污染 hover 过渡） */
.cell.f-pre{opacity:0;transform:translateY(24px) scale(.96)}
.cell.f-run{transition:opacity .5s ease-out,transform .5s ease-out}
</style>

<script>
/* ============ 索引页专属逻辑：计数自动化 + 筛选 + 区域链接 ============ */
(function(){
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const box = document.getElementById('filters');
const grid = document.getElementById('matrix');
if(!box || !grid) return;
const cells = [...grid.querySelectorAll('.cell')];
const counts = {ALL: cells.length};                       // 计数从 DOM 统计
cells.forEach(c => counts[c.dataset.cat] = (counts[c.dataset.cat] || 0) + 1);

const lang = () => window.CASE_LANG || 'en';

/* 头部宣称数也由 JS 生成——全站唯一事实源是卡片本身 */
function paintHead(){
  const T = CASE_T[lang()];
  const cats = Object.entries(counts).filter(([k]) => k !== 'ALL')
    .map(([k]) => `${T.cats[k] || k} ×${counts[k]}`).join(' / ');
  const k = document.querySelector('[data-i18n="awK"]');
  const m = document.querySelector('[data-i18n="awMeta"]');
  if(k) k.textContent = (T.awK || 'INDEX') + ' ×' + counts.ALL;
  if(m) m.textContent = cats;
}

function build(){
  box.innerHTML = '';
  Object.keys(counts).forEach(c => {
    if(c !== 'ALL' && !counts[c]) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fbtn' + (c === 'ALL' ? ' on' : '');
    b.dataset.cat = c;
    b.innerHTML = `${CASE_T[lang()].cats[c] || c}<sup>${counts[c] || 0}</sup>`;
    b.addEventListener('click', () => apply(c, b));
    box.appendChild(b);
  });
}

function apply(cat, btn){
  box.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
  btn.classList.add('on');
  const match = c => cat === 'ALL' || c.dataset.cat === cat;
  const show = cells.filter(match);
  cells.filter(c => !match(c)).forEach(c => { c.style.display = 'none'; });
  show.forEach((c, i) => {
    c.style.display = '';
    if(RM) return;
    c.classList.add('f-pre', 'f-run');
    c.style.transitionDelay = (i * 90) + 'ms';
  });
  if(!RM){
    requestAnimationFrame(() => requestAnimationFrame(() => {
      show.forEach(c => c.classList.remove('f-pre'));
      /* 结束清场：撤 transitionDelay 与过渡类，防污染后续 hover */
      setTimeout(() => show.forEach(c => {
        c.style.transitionDelay = ''; c.classList.remove('f-run');
      }), show.length * 90 + 560);
    }));
  }
}

function applyLinks(){
  const l = lang();
  grid.querySelectorAll('.cell[data-href-en]').forEach(a => {
    a.href = (l === 'zh' && a.dataset.hrefZh) ? a.dataset.hrefZh : a.dataset.hrefEn;
  });
}

build(); paintHead(); applyLinks();
/* 语言切换：重建按钮文案（保持当前分类）、重刷头部与链接 */
document.addEventListener('site:lang', () => {
  const active = box.querySelector('.fbtn.on');
  const cur = active ? active.dataset.cat : 'ALL';
  build();
  box.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b.dataset.cat === cur));
  paintHead(); applyLinks();
});
})();
</script>
